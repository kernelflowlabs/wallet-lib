name: Release mobile binaries

# Manually dispatched against an existing v* tag; publishes gomobile bindings
# as GitHub Release assets in two flavors, so consumers can download and
# checksum-verify the one they need:
#   wallet_mobile_full.aar               Android AAR, all chains
#   wallet_mobile_lite.aar               Android AAR, selected app chains
#   WalletMobile_full.xcframework.zip    iOS xcframework, all chains
#   WalletMobile_lite.xcframework.zip    iOS xcframework, selected app chains
#   checksums.txt                        sha256 of all four
# App consumers should pin the *_lite.* assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and release'
        required: true

permissions:
  contents: write      # create release + upload assets
  id-token: write      # attest-build-provenance
  attestations: write

jobs:
  build:
    runs-on: macos-latest   # macOS builds both the AAR and the xcframework
    env:
      LITE_CHAINS: evm sol trx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Verify Go toolchain
        run: |
          go version
          bash mobile/check-go-version.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: gomobile init

      - name: Build lite bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bash mobile/buildmobile.sh all "$LITE_CHAINS"
          mv dist/wallet_mobile.aar dist/wallet_mobile_lite.aar
          mv dist/WalletMobile.xcframework dist/WalletMobile_lite.xcframework

      - name: Build full bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bash mobile/buildmobile.sh all ""
          mv dist/wallet_mobile.aar dist/wallet_mobile_full.aar
          mv dist/WalletMobile.xcframework dist/WalletMobile_full.xcframework

      - name: Package + checksum
        run: |
          cd dist
          zip -r WalletMobile_full.xcframework.zip WalletMobile_full.xcframework
          zip -r WalletMobile_lite.xcframework.zip WalletMobile_lite.xcframework
          shasum -a 256 \
            wallet_mobile_full.aar \
            wallet_mobile_lite.aar \
            WalletMobile_full.xcframework.zip \
            WalletMobile_lite.xcframework.zip > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/wallet_mobile_full.aar
            dist/wallet_mobile_lite.aar
            dist/WalletMobile_full.xcframework.zip
            dist/WalletMobile_lite.xcframework.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/wallet_mobile_full.aar
            dist/wallet_mobile_lite.aar
            dist/WalletMobile_full.xcframework.zip
            dist/WalletMobile_lite.xcframework.zip
            dist/checksums.txt

      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in \
            wallet_mobile.aar \
            wallet_mobile_evm_sol.aar \
            WalletMobile.xcframework.zip \
            WalletMobile_evm_sol.xcframework.zip; do
            if gh release view "${{ inputs.tag }}" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset "${{ inputs.tag }}" "$asset" --yes
            fi
          done
